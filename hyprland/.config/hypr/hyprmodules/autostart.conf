# Start Polkit
exec-once= $uwsm /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# System Preferences
exec-once = gsettings set org.gnome.desktop.interface gtk-theme "Fluent-Dark"
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec-once = gsettings set org.gnome.desktop.interface cursor-theme "Bibata-Modern-Ice"

exec-once = systemctl --user import-environment $(env | cut -d'=' -f 1)
exec-once = dbus-update-activation-environment --systemd --all

# Hypr Ecosystem
exec-once = $uwsm $statusBar
exec-once = $uwsm hypridle
exec-once = $uwsm hyprpaper
exec-once = $uwsm mako
exec-once = wl-paste --watch cliphist store

# Applications
exec-once = $uwsm vesktop -m
